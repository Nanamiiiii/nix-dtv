name: Run nix check

on:
  push:
    branches: [main]
    paths:
      - '**/*.nix'
      - 'flake.lock'
  pull_request:
    branches: [main]
    paths:
      - '**/*.nix'
      - 'flake.lock'

permissions:
  contents: read

concurrency:
  group: test-nix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check x86_64-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true

      - name: Run flake checks
        run: nix flake check --print-build-logs
